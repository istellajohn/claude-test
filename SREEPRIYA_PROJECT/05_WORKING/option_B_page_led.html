<!doctype html><html><head><meta charset="utf-8"><title>Option B</title>
<link rel="stylesheet" href="base.css"><style>
body{background:radial-gradient(120% 90% at 30% 20%,#5d1630 0%,var(--wine) 55%,#3f0e20 100%);color:var(--blush)}
.card{position:absolute;left:62px;top:400px;width:1010px;transform:rotate(-1.6deg);transform-origin:left top;
background:#FCFCFC;box-shadow:0 2px 3px rgba(0,0,0,.25),0 30px 60px -10px rgba(0,0,0,.55),0 70px 120px -30px rgba(0,0,0,.45)}
.card img{display:block;width:100%}
.mast{position:absolute;left:62px;top:328px;width:230px;height:62px;transform:rotate(-1.6deg);transform-origin:left bottom;box-shadow:0 14px 30px -8px rgba(0,0,0,.55);overflow:hidden;background:#111}
.mast img{width:100%;height:100%;object-fit:cover;display:block}
.top{position:absolute;left:72px;right:72px;top:84px;display:flex;justify-content:space-between;color:var(--sand)}
.cue{position:absolute;left:72px;top:800px;white-space:nowrap;font:italic 300 132px/.95 'Newsreader';color:var(--blush);letter-spacing:-.02em}
.note{position:absolute;left:76px;top:1000px;width:620px;font:400 30px/1.4 'Newsreader';color:var(--sand)}

.meta{position:absolute;left:76px;top:1000px;text-align:left;font:500 17px/1.9 Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--mauve)}
.foot{position:absolute;left:72px;right:72px;bottom:56px;border-top:1px solid rgba(204,181,159,.35);padding-top:22px;display:flex;justify-content:space-between;font:500 16px/1 Inter;letter-spacing:.2em;text-transform:uppercase;color:var(--sand)}

</style></head><body>
<div class="top eyebrow"><span>From the reading desk</span><span>08 · 10 · 2026</span></div>

<div class="gloss"></div>
