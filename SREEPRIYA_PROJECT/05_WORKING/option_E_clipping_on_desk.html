<!doctype html><html><head><meta charset="utf-8"><title>Option E</title>
<link rel="stylesheet" href="base.css"><style>
body{background:var(--blush);color:var(--burgundy)}
.top{position:absolute;left:72px;right:72px;top:80px;display:flex;justify-content:space-between;color:var(--burgundy)}
.cuetop{font:italic 300 64px/1 'Newsreader';letter-spacing:-.01em;text-transform:none;position:relative;top:-18px}
.top span:last-child{color:var(--wine);opacity:.7}
.print{position:absolute;left:250px;top:170px;width:760px;padding:16px 16px 16px;background:#fff;transform:rotate(2deg);box-shadow:0 2px 3px rgba(0,0,0,.18),0 26px 50px -12px rgba(79,18,40,.5)}
.print .im{width:100%;aspect-ratio:1920/1282;background:url(../03_IMAGES/forbes_getty_hero.png) center/cover}
.print .cr{position:absolute;right:26px;bottom:26px;font:500 12px/1 Inter;letter-spacing:.16em;color:#fff;text-shadow:0 0 6px rgba(0,0,0,.5)}
.mast{position:absolute;left:62px;top:612px;width:230px;height:62px;transform:rotate(-1.4deg);transform-origin:left bottom;overflow:hidden;box-shadow:0 14px 28px -8px rgba(0,0,0,.5);z-index:3}
.mast img{width:100%;height:100%;object-fit:cover;display:block}
.clip{position:absolute;left:62px;top:676px;width:960px;transform:rotate(-1.4deg);transform-origin:left top;background:#FCFCFC;box-shadow:0 2px 3px rgba(0,0,0,.2),0 28px 55px -12px rgba(79,18,40,.55);z-index:2}
.clip img{display:block;width:100%}
.ex{position:absolute;left:370px;top:960px;width:640px;padding:16px 18px;background:#FCFCFC;transform:rotate(1deg);transform-origin:left top;box-shadow:0 2px 3px rgba(0,0,0,.2),0 24px 44px -12px rgba(79,18,40,.55);z-index:2}
.ex img{display:block;width:100%}
.foot{position:absolute;left:72px;right:72px;bottom:48px;border-top:1px solid rgba(97,1,36,.3);padding-top:20px;display:flex;justify-content:space-between;font:500 15px/1 Inter;letter-spacing:.2em;text-transform:uppercase;color:var(--wine)}
.logo{position:absolute;left:96px;top:1030px;height:130px}
</style></head><body>
<div class="top eyebrow"><span class="serif cuetop">Worth reading.</span><span>Forbes · 8 Oct 2026</span></div>
<div class="print"><div class="im"></div><div class="cr">GETTY</div></div>
<div class="mast"><img src="../03_IMAGES/forbes_masthead_crop.png"></div>
<div class="clip"><img src="../03_IMAGES/forbes_headline_crop.png"></div>
<div class="ex"><img src="../03_IMAGES/forbes_excerpt_patience.png"></div>
<img class="logo" src="../02_BRAND/entrust_logo_transparent.png" alt="Entrust Family Office"><div class="foot"><span></span><span>Link in caption</span></div>
<div class="grain" style="opacity:.3"></div></body></html>
