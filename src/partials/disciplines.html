<ul class="sys-list">
      <li><button type="button" class="sys" data-layer="direction"><h3>Creative direction</h3><p>We develop the visual and editorial direction of a project, then guide the choices that give it its character. This can include concepts, reference worlds, art direction and collaboration with the people making the work.</p></button></li>
      <li><button type="button" class="sys" data-layer="image"><h3>Film and photography</h3><p>We make images with an understanding of the person, subject or world they belong to. Our work moves through photography, moving image and visual storytelling, with the production shaped around the needs of each project.</p></button></li>
      <li><button type="button" class="sys" data-layer="writing"><h3>Writing and editorial</h3><p>We find language that belongs to its speaker and its subject. Our work includes ghostwriting, interviews, essays, scripts and campaign copy, with attention to how a thought moves and what it leaves unsaid.</p></button></li>
      <li><button type="button" class="sys" data-layer="identity"><h3>Branding and identity</h3><p>We give a business, artist or institution a recognisable identity through positioning, naming, design and language. We look for what is particular to the work and carry it into the details people will meet.</p></button></li>
      <li><button type="button" class="sys" data-layer="presence"><h3>Public presence and communication</h3><p>We shape how a person or project enters public life through positioning, publicity and partnerships. We consider what deserves to be shared, how it should be expressed and which encounters will serve the work.</p></button></li>
      <li><button type="button" class="sys" data-layer="digital"><h3>Digital strategy and marketing</h3><p>We look at how people discover, spend time with and respond to the work online. We develop digital and social strategies, content, search and paid campaigns, using the response to inform what happens next.</p></button></li>
    </ul>
