<form class="letter__form" data-letter novalidate>
        <label for="letter-email">Email address</label>
        <input id="letter-email" type="email" name="email" placeholder="Your email address" autocomplete="email" required>
        <button class="btn btn--solid" type="submit">Send me the letter</button>
        <p class="letter__status" role="status" aria-live="polite"></p>
      </form>
      <p class="mono muted letter__consent">By subscribing, you ask to receive the VALENCE Journal by email.</p>
